appId: org.studydesk.desktop
productName: StudyDesk
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64]
dmg:
  title: StudyDesk
  contents:
    - x: 130
      y: 180
    - x: 410
      y: 180
      type: link
      path: /Applications
  window:
    width: 540
    height: 360
